name: Build Custom

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Sanity check custom imports
        shell: bash
        run: |
          if grep -q 'addUserApi' src/core/init/userApi/index.ts; then
            echo 'BAD: addUserApi is still referenced (not exported by core/userApi)'
            exit 1
          fi
          grep -q 'importUserApi' src/core/init/userApi/index.ts || { echo 'BAD: importUserApi missing'; exit 1; }
          grep -q 'updateSetting' src/core/init/userApi/index.ts || { echo 'BAD: updateSetting missing'; exit 1; }
          test -f src/config/builtinSources.ts || { echo 'BAD: builtinSources.ts missing'; exit 1; }
          echo 'sanity check passed'

      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          cp ../.build-store/lxmusic.jks ./app/lxmusic.jks
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=lxmusic.jks \
            -PMYAPP_UPLOAD_KEY_ALIAS=lxmusic \
            -PMYAPP_UPLOAD_STORE_PASSWORD=XhzMusic2026 \
            -PMYAPP_UPLOAD_KEY_PASSWORD=XhzMusic2026

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xhz-music-apks
          path: artifacts/*.apk
          if-no-files-found: error
